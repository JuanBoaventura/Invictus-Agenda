<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações | Invictus Agenda</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        <a href="dashboard.html" class="brand sidebar-brand">
            <span class="brand-symbol">I</span>
            <span>INVICTUS <strong>AGENDA</strong></span>
        </a>

        <nav class="sidebar-nav">
            <a href="dashboard.html">▦ Dashboard</a>
            <a href="appointments.html">◷ Agendamentos</a>
            <a href="clients.html">♙ Clientes</a>
            <a href="services.html">◇ Serviços</a>
            <a href="settings.html" class="active">⚙ Configurações</a>
        </nav>

        <div class="sidebar-bottom">
            <nav class="sidebar-nav">
                <a href="login.html">↪ Sair</a>
            </nav>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="page-title">
                <h1>Configurações</h1>
                <p>Personalize as informações do sistema.</p>
            </div>
        </header>

        <section class="form-card">
            <div class="panel-header">
                <h2>Informações do estabelecimento</h2>
            </div>

            <form id="settingsForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="company">Nome do estabelecimento</label>
                        <input id="company" type="text" value="Invictus Studio" required>
                    </div>

                    <div class="form-group">
                        <label for="owner">Responsável</label>
                        <input id="owner" type="text" value="Administrador" required>
                    </div>

                    <div class="form-group">
                        <label for="businessEmail">E-mail</label>
                        <input id="businessEmail" type="email" value="contato@invictus.com">
                    </div>

                    <div class="form-group">
                        <label for="businessPhone">Telefone</label>
                        <input id="businessPhone" type="tel" value="(11) 99999-9999">
                    </div>

                    <div class="form-group full">
                        <label for="address">Endereço</label>
                        <textarea id="address" rows="3">São Paulo - SP</textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-gold">Salvar configurações</button>
                </div>
            </form>
        </section>
    </main>
</div>

<script src="../assets/js/script.js"></script>
</body>
</html>
