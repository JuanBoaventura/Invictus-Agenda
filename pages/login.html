<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Invictus Agenda</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-page">

    <section class="login-card">
        <a href="../index.html" class="brand">
            <span class="brand-symbol">I</span>
            <span>INVICTUS <strong>AGENDA</strong></span>
        </a>

        <h1>Bem-vindo novamente</h1>
        <p>Entre na sua conta para acessar o sistema.</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="seuemail@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input id="password" type="password" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn btn-gold">Entrar no sistema</button>
        </form>

        <a href="../index.html" class="login-back">← Voltar para a página inicial</a>
    </section>

    <script src="../assets/js/script.js"></script>
</body>
</html>
